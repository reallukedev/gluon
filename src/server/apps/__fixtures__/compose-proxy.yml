# Public reverse proxy + dynamic DNS for server.leech.party
#   caddy  - TLS termination (Let's Encrypt) and routing, see ./caddy/
#            (routes are managed in the Domains app, a CasaOS tile on :8099)
#   ddns   - keeps Cloudflare A records pointed at this network's public IPv4
# Secrets live in ./.env (chmod 600). See ./README.md for day-to-day tasks.

name: proxy

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]
    tmpfs: [/tmp]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3; harmless if UDP 443 isn't forwarded on the router
    volumes:
      # Caddyfile + routes.json, written by the Domains app (CasaOS tile, :8099)
      - ./caddy:/etc/caddy:ro
      # Admin API unix socket, shared with the Domains app for live reloads
      - caddy_admin:/run/caddy
      - caddy_data:/data # certificates + ACME account
      - caddy_config:/config
    extra_hosts:
      # Lets Caddy reach apps published on this host: host.docker.internal:<port>
      - "host.docker.internal:host-gateway"
    networks:
      - proxy
    logging: *logging

  ddns:
    image: favonia/cloudflare-ddns:1
    container_name: cloudflare-ddns
    restart: unless-stopped
    <<: *hardening
    user: "1000:1000"
    env_file: .env # CLOUDFLARE_API_TOKEN
    # Host networking so it can read this machine's own IPv6 address.
    network_mode: host
    environment:
      # A + AAAA, DNS-only. The wildcard covers every <name>.server.leech.party,
      # so subdomains added in the Domains app need no DNS change. Caddy only
      # answers for names it has routes for; anything else fails the TLS handshake.
      DOMAINS: jellyfin.server.leech.party,*.server.leech.party,octo.server.leech.party,gluon.leech.party
      # A only: Cloudflare proxies it and reaches this origin over IPv4.
      IP4_DOMAINS: server.leech.party
      # Orange cloud only for server.leech.party (CasaOS). Jellyfin stays DNS-only:
      #  - streaming video through Cloudflare's proxy violates their ToS
      #  - Cloudflare's free edge certificate only covers *.leech.party, so a
      #    proxied x.server.leech.party would fail TLS anyway
      PROXIED: is(server.leech.party)
      # AAAA lets home devices reach Jellyfin directly over IPv6, avoiding the
      # AT&T gateway's unreliable NAT loopback on the public IPv4.
      IP6_PROVIDER: local.iface:enp4s0
      RECORD_COMMENT: "managed by cloudflare-ddns on leech (~/proxy)"
    logging: *logging

networks:
  proxy:
    name: proxy
    enable_ipv6: true # so Caddy sees real IPv6 client addresses
    ipam:
      config:
        - subnet: 172.30.0.0/24
        - subnet: fd00:172:30::/64

volumes:
  caddy_data:
  caddy_config:
  caddy_admin:
    name: proxy_caddy_admin # the Domains app mounts this by name
